# Later --config files override earlier files field-by-field.
# Command line arguments override every config file.

[spot]
flop = "As7h2c"
pot = 200
effective_stack = 900
first_player = "oop"
oop_range = "99+,ATs+,KQs,AJo+"
ip_range = "TT+,A2s+,KTs+,QJs,ATo+"

[tree]
preset = "postflop-basic"
enumerate_chance = false

[solver]
iterations = 4
threads = 1
log_interval = 1
exploitability_interval = 2
target_exploitability_bb100 = 1.0
variant = "dcfr-plus"
average_strategy = "reach-weighted"
dcfr_alpha = 1.5
dcfr_beta = 0.0
dcfr_gamma = 2.0

[output]
print_nodes = 20
print_turns = 8
chunk_mib = 256

[logging]
level = "info"
