# Tiny config for CLI/API smoke checks. This is not a meaningful poker spot.

[spot]
flop = "As7h2c"
pot = 200
effective_stack = 900
first_player = "oop"
oop_range = "99+,ATs+,KQs,AJo+"
ip_range = "TT+,A2s+,KTs+,QJs,ATo+"

[tree]
preset = "postflop-basic"
enumerate_chance = false
min_bet = 100
flop_first_bets = ["60%", "allin"]
flop_donk_bets = []
turn_first_bets = ["60%", "allin"]
turn_donk_bets = []
river_first_bets = ["60%", "allin"]
river_donk_bets = ["50%"]
raise_multiplier = 2.5
raise_sizes = ["2.5x"]
max_raises_per_street = 2
add_all_in_threshold = 1.5
force_all_in_threshold = 0.15
merging_threshold = 0.1

[solver]
iterations = 1
threads = 0 # auto: use available CPU parallelism
log_interval = 1
exploitability_interval = 0
variant = "dcfr-plus"
average_strategy = "reach-weighted"
dcfr_alpha = 1.5
dcfr_beta = 0.0
dcfr_gamma = 2.0

[output]
print_nodes = 20
print_turns = 8
chunk_mib = 256

[logging]
level = "info"
