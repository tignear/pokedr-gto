# Starter config for the interactive solution viewer.
#
# This intentionally keeps the postflop-solver basic action tree shape:
# - bet sizes: 60%, geometric, all-in
# - raise size: 2.5x previous bet
# - turn donk uses the regular bet sizes
# - river donk is 50%

[spot]
flop = "As7h2c"
pot = 200
effective_stack = 900
first_player = "oop"
oop_range = "99+,ATs+,KQs,AJo+"
ip_range = "TT+,A2s+,KTs+,QJs,ATo+"

[tree]
preset = "postflop-basic"
enumerate_chance = false

[solver]
iterations = 16
threads = 0 # auto: use available CPU parallelism
log_interval = 4
exploitability_interval = 16
variant = "dcfr-plus"
average_strategy = "reach-weighted"
dcfr_alpha = 1.5
dcfr_beta = 0.0
dcfr_gamma = 2.0

[output]
print_nodes = 20
print_turns = 8
chunk_mib = 256

[logging]
level = "info"
