<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokedr Short Stack Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    body {
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      box-sizing: border-box;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 12px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, Canvas);
      border-radius: 6px;
      background: Canvas;
      color: CanvasText;
    }
    button {
      width: fit-content;
      padding: 8px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 24%, Canvas);
      border-radius: 6px;
      background: Canvas;
      color: CanvasText;
      cursor: pointer;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .metric {
      border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas);
      border-radius: 6px;
      padding: 10px;
    }
    .metric b {
      display: block;
      font-size: 12px;
      opacity: .7;
      margin-bottom: 4px;
    }
    .ranges {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
    }
    .range {
      border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas);
      border-radius: 6px;
      padding: 12px;
    }
    .range h2 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    .matrix {
      display: grid;
      grid-template-columns: repeat(13, minmax(22px, 1fr));
      gap: 3px;
      margin-bottom: 14px;
    }
    .cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas);
      border-radius: 4px;
      opacity: .35;
      background: color-mix(in srgb, CanvasText 4%, Canvas);
    }
    .cell.in {
      opacity: 1;
      color: #08111f;
      border-color: transparent;
    }
    .cell.pair.in {
      background: #f4c542;
    }
    .cell.suited.in {
      background: #57c7a3;
    }
    .cell.offsuit.in {
      background: #7aa7ff;
    }
    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .legend span {
      border-radius: 4px;
      padding: 3px 6px;
      color: #08111f;
    }
    .legend .pair {
      background: #f4c542;
    }
    .legend .suited {
      background: #57c7a3;
    }
    .legend .offsuit {
      background: #7aa7ff;
    }
    .error {
      color: #b42318;
    }
  </style>
</head>
<body>
  <main>
    <textarea id="input" spellcheck="false" placeholder="Paste `pokedr-cli --format json` output here"></textarea>
    <button id="render">Render</button>
    <section id="output"></section>
  </main>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    document.getElementById('render').addEventListener('click', render);

    function render() {
      let data;
      try {
        data = JSON.parse(input.value);
      } catch (error) {
        output.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        return;
      }

      const metrics = [
        ['Level', data.level],
        ['Stack', `${data.stack} (${data.stack_in_big_blinds.toFixed(2)} BB)`],
        ['Alive', data.alive_players],
        ['Dead Pot', data.dead_pot],
        ['Orbit Cost', data.orbit_cost],
        ['Call Eq', pct(data.single_call_required_equity)],
        ['Overcall Eq', pct(data.overcall_required_equity)],
      ];

      output.innerHTML = `
        <section class="summary">
          ${metrics.map(([label, value]) => `<div class="metric"><b>${label}</b>${value}</div>`).join('')}
        </section>
        <section class="ranges">
          ${data.seats.map(renderSeat).join('')}
        </section>
      `;
    }

    function renderSeat(seat) {
      return `
        <article class="range">
          <h2>Seat ${seat.seat_index} (${seat.players_behind} behind)</h2>
          <div class="summary">
            <div class="metric"><b>Posted</b>${seat.posted_amount}</div>
            <div class="metric"><b>Call Eq</b>${pct(seat.call_required_equity)}</div>
            <div class="metric"><b>Overcall Eq</b>${pct(seat.overcall_required_equity)}</div>
          </div>
          ${Object.entries(seat.ranges).map(([name, range]) => renderRange(name, range)).join('')}
        </article>
      `;
    }

    function renderRange(name, range) {
      return `
        <section>
          <h2>${title(name)}: ${range.classes} classes, ${range.combos} combos (${pct(range.combo_fraction)})</h2>
          <div class="legend">
            <span class="pair">pair</span>
            <span class="suited">suited</span>
            <span class="offsuit">offsuit</span>
          </div>
          <div class="matrix">
            ${renderMatrix(range)}
          </div>
        </section>
      `;
    }

    function renderMatrix(range) {
      const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
      const byHand = new Map(range.hands.map(hand => [hand.hand, hand]));
      const cells = [];

      for (let row = 0; row < ranks.length; row++) {
        for (let col = 0; col < ranks.length; col++) {
          const hand = matrixHand(ranks, row, col);
          const result = byHand.get(hand);
          const kind = hand.length === 2 ? 'pair' : hand.endsWith('s') ? 'suited' : 'offsuit';
          const title = result
            ? `${hand} equity ${pct(result.equity)}, ev ${result.ev.toFixed(4)}`
            : hand;
          cells.push(`<span class="cell ${kind}${result ? ' in' : ''}" title="${escapeHtml(title)}">${hand}</span>`);
        }
      }

      return cells.join('');
    }

    function matrixHand(ranks, row, col) {
      if (row === col) {
        return `${ranks[row]}${ranks[col]}`;
      }
      if (row < col) {
        return `${ranks[row]}${ranks[col]}s`;
      }
      return `${ranks[col]}${ranks[row]}o`;
    }

    function pct(value) {
      return `${(value * 100).toFixed(1)}%`;
    }

    function title(value) {
      return value.replaceAll('_', ' ');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }
  </script>
</body>
</html>
