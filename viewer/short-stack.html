<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokedr Short Stack Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    body {
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      box-sizing: border-box;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 12px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, Canvas);
      border-radius: 6px;
      background: Canvas;
      color: CanvasText;
    }
    button {
      width: fit-content;
      padding: 8px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 24%, Canvas);
      border-radius: 6px;
      background: Canvas;
      color: CanvasText;
      cursor: pointer;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .metric {
      border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas);
      border-radius: 6px;
      padding: 10px;
    }
    .metric b {
      display: block;
      font-size: 12px;
      opacity: .7;
      margin-bottom: 4px;
    }
    .roots {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .root {
      border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas);
      border-radius: 6px;
      padding: 12px;
    }
    .root h2 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    .decision {
      border-top: 1px solid color-mix(in srgb, CanvasText 14%, Canvas);
      margin-top: 14px;
      padding-top: 12px;
    }
    .decision h3,
    .decision h4 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    details {
      border: 1px solid color-mix(in srgb, CanvasText 14%, Canvas);
      border-radius: 6px;
      margin: 8px 0;
      padding: 8px;
    }
    summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    summary .muted {
      font-weight: 500;
      opacity: .72;
      margin-left: 8px;
    }
    .branch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .branch {
      border: 1px solid color-mix(in srgb, CanvasText 12%, Canvas);
      border-radius: 6px;
      padding: 10px;
    }
    .branch h4 {
      font-size: 13px;
      margin: 0 0 8px;
    }
    .node-body {
      margin-top: 10px;
      display: grid;
      gap: 10px;
    }
    .matrix {
      display: grid;
      grid-template-columns: repeat(13, minmax(22px, 1fr));
      gap: 3px;
      margin-bottom: 14px;
    }
    .cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas);
      border-radius: 4px;
      opacity: .35;
      background: color-mix(in srgb, CanvasText 4%, Canvas);
      cursor: pointer;
      overflow: hidden;
      position: relative;
      user-select: none;
    }
    .cell::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--freq, 0%);
      background: var(--fill, color-mix(in srgb, CanvasText 8%, Canvas));
    }
    .cell span {
      position: relative;
      z-index: 1;
    }
    .cell:focus-visible {
      outline: 2px solid color-mix(in srgb, CanvasText 70%, Canvas);
      outline-offset: 2px;
    }
    .cell.selected {
      box-shadow: 0 0 0 2px CanvasText inset;
    }
    .cell.in {
      opacity: 1;
      color: #08111f;
      border-color: transparent;
      background: color-mix(in srgb, CanvasText 8%, Canvas);
    }
    .cell.pair.in {
      --fill: #f4c542;
    }
    .cell.suited.in {
      --fill: #57c7a3;
    }
    .cell.offsuit.in {
      --fill: #7aa7ff;
    }
    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .legend span {
      border-radius: 4px;
      padding: 3px 6px;
      color: #08111f;
    }
    .legend .pair {
      background: #f4c542;
    }
    .legend .suited {
      background: #57c7a3;
    }
    .legend .offsuit {
      background: #7aa7ff;
    }
    .error {
      color: #b42318;
    }
    .hand-panel {
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas);
      border-radius: 6px;
      padding: 10px;
      margin: -4px 0 14px;
      min-height: 22px;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: color-mix(in srgb, CanvasText 3%, Canvas);
    }
    .hand-panel .muted {
      opacity: .65;
    }
  </style>
</head>
<body>
  <main>
    <textarea id="input" spellcheck="false" placeholder="Paste `pokedr-cli --format json` output here"></textarea>
    <button id="render">Render</button>
    <section id="output"></section>
  </main>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    let rangeBlockId = 0;
    document.getElementById('render').addEventListener('click', render);
    output.addEventListener('click', event => {
      const cell = event.target.closest('.cell');
      if (cell) {
        selectHand(cell);
      }
    });
    output.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') {
        return;
      }
      const cell = event.target.closest('.cell');
      if (!cell) {
        return;
      }
      event.preventDefault();
      selectHand(cell);
    });

    function render() {
      let data;
      try {
        data = JSON.parse(input.value);
      } catch (error) {
        output.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        return;
      }

      rangeBlockId = 0;
      const metrics = [
        ['Level', data.level],
        ['Stack', `${data.stack} (${data.stack_in_big_blinds.toFixed(2)} BB)`],
        ['Alive', data.alive_players],
        ['Dead Pot', data.dead_pot],
        ['Orbit Cost', data.orbit_cost],
        ['Call Eq', pct(data.single_call_required_equity)],
        ['Overcall Eq', pct(data.overcall_required_equity)],
      ];

      output.innerHTML = `
        <section class="summary">
          ${metrics.map(([label, value]) => `<div class="metric"><b>${label}</b>${value}</div>`).join('')}
        </section>
        <section class="roots">
          ${buildRoots(data).map(root => renderRoot(root, data.alive_players)).join('')}
        </section>
      `;
    }

    function buildRoots(data) {
      return data.seats
        .filter(seat => seat.players_behind > 0)
        .map(opener => ({
          opener,
          decisions: data.seats
            .flatMap(seat => (seat.call_spots || []).map(spot => ({ caller: seat, spot })))
            .filter(decision => decision.spot.opener_seat === opener.seat_index)
            .sort((left, right) => left.caller.seat_index - right.caller.seat_index),
        }));
    }

    function renderRoot(root, alivePlayers) {
      const opener = root.opener;
      const openAi = opener.ranges.first_in_all_in;
      const open2bb = opener.ranges.first_in_open_2bb ?? emptyRange();
      return `
        <details class="root">
          <summary>Root: Seat ${opener.seat_index} first-in <span class="muted">2bb ${rangeSummary(open2bb)} / AI ${rangeSummary(openAi)}</span></summary>
          <div class="node-body">
            <div class="summary">
              <div class="metric"><b>Posted</b>${opener.posted_amount}</div>
              <div class="metric"><b>Behind</b>${opener.players_behind}</div>
              <div class="metric"><b>Open 2bb</b>${rangeSummary(open2bb)}</div>
              <div class="metric"><b>Open AI</b>${rangeSummary(openAi)}</div>
              <div class="metric"><b>Response Nodes</b>${root.decisions.length}</div>
            </div>
            ${renderRangeBlock('open 2bb range', open2bb)}
            ${renderRangeBlock('open AI range', openAi)}
            ${root.decisions.map(decision => renderDecision(opener, decision, alivePlayers)).join('')}
          </div>
        </details>
      `;
    }

    function renderDecision(opener, decision, alivePlayers) {
      const spot = decision.spot;
      const caller = decision.caller;
      const patterns = spot.patterns || [];
      return `
        <details class="decision">
          <summary>Seat ${caller.seat_index} responds to Seat ${opener.seat_index} open AI <span class="muted">${rangeSummary(spot.range)}</span></summary>
          <div class="node-body">
            <div class="summary">
              <div class="metric"><b>Effective</b>${spot.effective_all_in_cost}</div>
              <div class="metric"><b>Required</b>${pct(spot.required_equity)}</div>
              <div class="metric"><b>Call Range</b>${rangeSummary(spot.range)}</div>
              <div class="metric"><b>Branches</b>${patterns.length}</div>
            </div>
            ${renderRangeBlock(`Seat ${caller.seat_index} call range at this node`, spot.range)}
            ${spot.next_response ? renderResponseNode(opener, spot.next_response, alivePlayers) : ''}
            <details>
              <summary>Outcome branches after Seat ${caller.seat_index} calls</summary>
              <div class="branch-grid">
                ${patterns.map(pattern => renderBranch(opener, caller, pattern, alivePlayers)).join('')}
              </div>
            </details>
          </div>
        </details>
      `;
    }

    function renderResponseNode(opener, node, alivePlayers) {
      const prior = node.prior_callers.length ? node.prior_callers.map(seat => `Seat ${seat}`).join(', ') : 'none';
      const path = responsePath(opener.seat_index, node.prior_callers, node.actor_seat);
      return `
        <details class="decision">
          <summary>Seat ${node.actor_seat} overcall decision <span class="muted">${rangeSummary(node.range)}</span></summary>
          <div class="node-body">
            <div class="summary">
              <div class="metric"><b>Path</b>${escapeHtml(path)}</div>
              <div class="metric"><b>Prior Callers</b>${escapeHtml(prior)}</div>
              <div class="metric"><b>Call Range</b>${rangeSummary(node.range)}</div>
            </div>
            ${renderRangeBlock(`Seat ${node.actor_seat} overcall range`, node.range)}
            ${renderChildResponse('After call', opener, node.next_response, alivePlayers)}
            ${renderChildResponse('After fold', opener, node.fold_response, alivePlayers)}
          </div>
        </details>
      `;
    }

    function renderChildResponse(label, opener, node, alivePlayers) {
      if (!node) {
        return '';
      }
      return `
        <details>
          <summary>${label}: Seat ${node.actor_seat} decision <span class="muted">${rangeSummary(node.range)}</span></summary>
          <div class="node-body">
            ${renderResponseNode(opener, node, alivePlayers)}
          </div>
        </details>
      `;
    }

    function responsePath(openerSeat, priorCallers, actorSeat) {
      const actions = [`Seat ${openerSeat}: AI`];
      for (let seat = openerSeat + 1; seat < actorSeat; seat++) {
        actions.push(`Seat ${seat}: ${priorCallers.includes(seat) ? 'call AI' : 'fold'}`);
      }
      actions.push(`Seat ${actorSeat}: decision`);
      return actions.join(' -> ');
    }

    function renderBranch(opener, caller, pattern, alivePlayers) {
      const path = branchPath(opener.seat_index, caller.seat_index, pattern.callers, alivePlayers);
      return `
        <section class="branch">
          <h4>${pattern.way}-way branch</h4>
          <div class="summary">
            <div class="metric"><b>Path</b>${escapeHtml(path)}</div>
            <div class="metric"><b>Probability</b>${pct(pattern.probability)}</div>
            <div class="metric"><b>Callers</b>${pattern.callers.length ? pattern.callers.map(seat => `Seat ${seat}`).join(', ') : 'none'}</div>
          </div>
        </section>
      `;
    }

    function branchPath(openerSeat, callerSeat, laterCallers, alivePlayers) {
      const actions = [`Seat ${openerSeat}: AI`];
      for (let seat = openerSeat + 1; seat < callerSeat; seat++) {
        actions.push(`Seat ${seat}: fold`);
      }
      actions.push(`Seat ${callerSeat}: call AI`);
      for (let seat = callerSeat + 1; seat < alivePlayers; seat++) {
        actions.push(`Seat ${seat}: ${laterCallers.includes(seat) ? 'call AI' : 'fold'}`);
      }
      return actions.join(' -> ');
    }

    function renderRangeBlock(name, range) {
      const blockId = `range-${rangeBlockId++}`;
      return `
        <section class="range-block" data-range-block="${blockId}">
          <h4>${title(name)}: ${rangeSummary(range)}</h4>
          ${renderLegend()}
          <div class="matrix">
            ${renderMatrix(range, blockId)}
          </div>
          <div class="hand-panel" id="${blockId}-detail"><span class="muted">Select a hand</span></div>
        </section>
      `;
    }

    function renderLegend() {
      return `
        <div class="legend">
          <span class="pair">pair</span>
          <span class="suited">suited</span>
          <span class="offsuit">offsuit</span>
        </div>
      `;
    }

    function renderMatrix(range, blockId) {
      const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
      const byHand = new Map(range.hands.map(hand => [hand.hand, hand]));
      const cells = [];

      for (let row = 0; row < ranks.length; row++) {
        for (let col = 0; col < ranks.length; col++) {
          const hand = matrixHand(ranks, row, col);
          const result = byHand.get(hand);
          const kind = hand.length === 2 ? 'pair' : hand.endsWith('s') ? 'suited' : 'offsuit';
          const cellTitle = result ? handDetail(hand, result) : hand;
          const style = result ? ` style="--freq:${cellFrequency(result).toFixed(1)}%"` : '';
          cells.push(`<span class="cell ${kind}${result ? ' in' : ''}"${style} role="button" tabindex="0" title="${escapeHtml(cellTitle)}" data-detail-target="${blockId}-detail" data-detail="${escapeHtml(cellTitle)}"><span>${hand}</span></span>`);
        }
      }

      return cells.join('');
    }

    function selectHand(cell) {
      const detail = document.getElementById(cell.dataset.detailTarget);
      if (!detail) {
        return;
      }

      const block = cell.closest('.range-block');
      block?.querySelectorAll('.cell.selected').forEach(selected => selected.classList.remove('selected'));
      cell.classList.add('selected');
      detail.textContent = cell.dataset.detail;
    }

    function handDetail(hand, result) {
      const parts = [
        `${hand} equity ${pct(result.equity)}`,
        `ev ${result.ev.toFixed(4)}`,
        `selected ${pct(result.frequency ?? 1)}`,
      ];

      if (result.call_value != null) {
        parts.push(`call ${result.call_value.toFixed(4)}`);
      }
      if (result.fold_value != null) {
        parts.push(`fold ${result.fold_value.toFixed(4)}`);
      }

      return parts.join(', ');
    }

    function cellFrequency(result) {
      const frequency = result.frequency ?? 1;
      return 100 * Math.max(0, Math.min(1, frequency));
    }

    function matrixHand(ranks, row, col) {
      if (row === col) {
        return `${ranks[row]}${ranks[col]}`;
      }
      if (row < col) {
        return `${ranks[row]}${ranks[col]}s`;
      }
      return `${ranks[col]}${ranks[row]}o`;
    }

    function pct(value) {
      return `${(value * 100).toFixed(1)}%`;
    }

    function rangeSummary(range) {
      const weightedFraction = range.weighted_combo_fraction ?? range.combo_fraction;
      const weightedCombos = range.weighted_combos ?? range.combos;
      return `${range.classes} classes, ${weightedCombos.toFixed(1)} w-combos (${pct(weightedFraction)})`;
    }

    function emptyRange() {
      return {
        classes: 0,
        combos: 0,
        combo_fraction: 0,
        weighted_combos: 0,
        weighted_combo_fraction: 0,
        hands: [],
      };
    }

    function title(value) {
      return value.replaceAll('_', ' ');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }
  </script>
</body>
</html>
